<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Vue Template</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>

<body>
    <div id="app">
        <custom-input v-model="message"></custom-input>
        <p>Current value: {{ message }}</p>
        <p>2nd commit test</p>
        <p>Uploaded to Netlify</p>
    </div>
    <script>
        const CustomInput = {
            props: {
                modelValue: String
            },
            template: `
                <input
                    type="text"
                    :value="modelValue"
                    @input="$emit('update:modelValue', $event.target.value)"
                />
            `
        };
        Vue.createApp({
            components: {
                CustomInput
            },
            data() {
                return {
                    message: ''
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
